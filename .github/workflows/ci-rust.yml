name: CI

# Runs on every PR and on pushes to the default branch. The "on green CI, merge"
# rule depends on this workflow being the required status check — set it as required
# under branch protection (see docs/ci-and-branch-protection.md). The job name
# below, `check`, is the status check context that rule has to name.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        # Warnings fail the build, matching the "no unwrap/expect outside tests,
        # clippy clean" standard.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      # `repowise-web` is deliberately outside the root workspace (it only
      # ever targets wasm32; see its section in README.md), which means the
      # workspace-wide Format/Clippy/Test steps above skip it entirely. It
      # therefore needs its own gate, or the only frontend in the repo would
      # be held to a weaker standard than every other crate.
      - name: Format (WASM web crate)
        run: cargo fmt --manifest-path crates/repowise-web/Cargo.toml -- --check

      # Runs on the host target, not wasm: the crate's pure logic (the
      # treemap layout in particular) is testable without a browser, and
      # the alternative is a frontend with no test coverage at all.
      - name: Test (WASM web crate)
        run: cargo test --manifest-path crates/repowise-web/Cargo.toml

      # Clippy compiles as it lints, so this subsumes the bare `cargo check`
      # this step replaced.
      - name: Clippy (WASM web crate)
        run: >
          cargo clippy
          --manifest-path crates/repowise-web/Cargo.toml
          --target wasm32-unknown-unknown
          --all-targets -- -D warnings

