[package]
name = "repowise-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "repowise"
path = "src/main.rs"

[dependencies]
repowise-core = { path = "../repowise-core" }
repowise-parser = { path = "../repowise-parser" }
repowise-graph = { path = "../repowise-graph" }
repowise-health = { path = "../repowise-health" }
repowise-refactor = { path = "../repowise-refactor" }
repowise-git = { path = "../repowise-git" }
repowise-docs = { path = "../repowise-docs" }
repowise-adr = { path = "../repowise-adr" }
repowise-distill = { path = "../repowise-distill" }
repowise-sql = { path = "../repowise-sql" }
repowise-openapi = { path = "../repowise-openapi" }
repowise-protobuf = { path = "../repowise-protobuf" }
repowise-graphql = { path = "../repowise-graphql" }
repowise-terraform = { path = "../repowise-terraform" }
repowise-external-deps = { path = "../repowise-external-deps" }
repowise-security = { path = "../repowise-security" }
repowise-tour = { path = "../repowise-tour" }
repowise-domains = { path = "../repowise-domains" }
# Cross-platform filesystem events for `repowise watch`. Pinned to the
# latest stable major (9.x is a release candidate). Its transitive deps
# are almost entirely platform-gated backends -- inotify on Linux,
# kqueue on BSD/macOS, windows-sys elsewhere -- so only one set builds.
notify = "8"
repowise-mcp = { path = "../repowise-mcp" }
repowise-llm = { path = "../repowise-llm" }
repowise-server = { path = "../repowise-server" }
repowise-workspace = { path = "../repowise-workspace" }
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json.workspace = true
# Already resolved at this exact version in Cargo.lock (repowise-health,
# repowise-server and repowise-external-deps all depend on it), so this
# adds no new crate version to the tree -- the same precedent
# repowise-server's own `ring` dependency records. Used read-only, to
# detect whether a Codex `config.toml` already registers this server.
toml = "0.8"
clap.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
