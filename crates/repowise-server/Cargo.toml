[package]
name = "repowise-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
repowise-core = { path = "../repowise-core" }
repowise-graph = { path = "../repowise-graph" }
repowise-health = { path = "../repowise-health" }
repowise-refactor = { path = "../repowise-refactor" }
repowise-external-deps = { path = "../repowise-external-deps" }
repowise-git = { path = "../repowise-git" }
repowise-adr = { path = "../repowise-adr" }
repowise-docs = { path = "../repowise-docs" }
repowise-llm = { path = "../repowise-llm" }
repowise-parser = { path = "../repowise-parser" }
repowise-workspace = { path = "../repowise-workspace" }
repowise-distill = { path = "../repowise-distill" }
repowise-security = { path = "../repowise-security" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Already fully resolved in Cargo.lock (repowise-health's own
# dependency, same version) -- parses/writes `.repowise/config.toml`
# (issue #359).
toml = "0.8"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
# Already fully resolved in Cargo.lock (pulled in transitively via
# rustls, itself a `ureq`/TLS dependency of repowise-adr/repowise-git/
# repowise-llm), so adding it directly adds no new crate version to the
# dependency tree -- same precedent repowise-workspace's `regex`
# dependency already set. Used for constant-time GitHub/GitLab webhook
# signature verification (issue #335); `ring::hmac`/
# `ring::constant_time` do the comparison, not hand-rolled code, since
# a non-constant-time secret comparison is exactly the kind of subtle
# security bug worth a dependency to avoid.
ring = "0.17"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
